[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simfolio-forecasting-methodology"
version = "0.2.0"
description = "Standalone reproducible out-of-sample methodology for probabilistic portfolio forecasting."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "pyyaml>=6.0,<7",
]

[project.scripts]
simfolio-oos = "simfolio_forecasting_methodology.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
