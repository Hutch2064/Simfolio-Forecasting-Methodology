[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simfolio-forecasting-methodology"
version = "0.3.0"
description = "Standalone reproducible out-of-sample methodology for probabilistic portfolio forecasting."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.6; python_version == '3.11'",
  "numpy==2.5.3; python_version == '3.12'",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "scipy==1.17.1; python_version == '3.11'",
  "scipy==1.18.1; python_version == '3.12'",
]

[project.scripts]
simfolio-oos = "simfolio_forecasting_methodology.cli:main"

[project.optional-dependencies]
all-models = [
  "arch==8.0.0",
  "numba==0.67.0",
  "scikit-learn==1.9.0",
  "statsmodels==0.15.0",
]
rough-jump-vine = ["pyvinecopulib==0.7.5", "pybind11==3.1.0"]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simfolio_forecasting_methodology = ["resources/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# These retained experiment adapters are bound byte-for-byte in published
# manifests. Preserve their import sequence rather than restyle scored sources.
"tools/expanded_controls/models.py" = ["I001"]
"tools/expanded_linear_pool/models.py" = ["I001"]
"tools/expanded_panel/run_panel.py" = ["I001"]
"tools/expanded_panel/run_cached_panel.py" = ["I001"]
"tools/fast_moment_controls/models.py" = ["I001"]
"tools/raw_stationary_bootstrap/models.py" = ["I001"]
# The diagnostic preflight records every exception as a failed fit admission.
"tools/garch_filtered_history/admission_preflight.py" = ["I001", "BLE001"]
# The scaled callback is consumed synchronously before the loop advances.
"tools/garch_filtered_history/models.py" = ["I001", "B023"]
