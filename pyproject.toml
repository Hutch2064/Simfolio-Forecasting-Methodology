[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simfolio-forecasting-methodology"
version = "0.3.0"
description = "Standalone reproducible out-of-sample methodology for probabilistic portfolio forecasting."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.6; python_version == '3.11'",
  "numpy==2.5.3; python_version == '3.12'",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "scipy==1.17.1; python_version == '3.11'",
  "scipy==1.18.1; python_version == '3.12'",
]

[project.scripts]
simfolio-oos = "simfolio_forecasting_methodology.cli:main"

[project.optional-dependencies]
all-models = [
  "arch==8.0.0",
  "numba==0.67.0",
  "scikit-learn==1.9.0",
  "statsmodels==0.15.0",
]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simfolio_forecasting_methodology = ["resources/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
