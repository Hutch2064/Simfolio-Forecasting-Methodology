[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simfolio-forecasting-methodology"
version = "0.3.0"
description = "Standalone reproducible out-of-sample methodology for probabilistic portfolio forecasting."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "scipy>=1.13,<2",
]

[project.scripts]
simfolio-oos = "simfolio_forecasting_methodology.cli:main"

[project.optional-dependencies]
all-models = [
  "arch>=8,<9",
  "numba>=0.67,<0.68",
  "scikit-learn>=1.9,<2",
  "statsmodels>=0.15,<0.16",
]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simfolio_forecasting_methodology = ["resources/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
