name: methodology-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          set -o pipefail
          ruff check src tests 2>&1 | tee ruff-diagnostics.txt
      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff-diagnostics.txt
      - name: Tests and publication-safety gate
        run: pytest -q
